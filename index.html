<style>
/* Phone shell (LAN app, away app, snapshot/APK share this file). Read-only. Design tokens + safe areas + screens.
   --sat/--sab are the iOS safe-area insets (env()); tests simulate a notch by setting them on <html>.
   Round 3 (2026-11-20): rem type scale (follows the phone's text size, 200% safe), one status strip instead of three banners,
   sticky translucent header, privacy blur, PIN lock, alert severity pills, light-theme chart tokens, 44 px controls everywhere. */
:root{--bg:#0b0f14;--card:#141a22;--card2:#1b232d;--fg:#eef2f6;--mut:#8c9bab;--mut2:#7f8c9a;--good:#2fd37a;--bad:#ff5a5a;--warn:#f5b84a;--acc:#5aa3ff;--line:#222c37;--line2:#2c3843;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--nav:60px;--hdr:52px;--r:14px;--pad:16px;--glass:rgba(11,15,20,.86);color-scheme:dark;
  --ch-grid:rgba(141,160,179,.16);--ch-axis:rgba(141,160,179,.45);--ch-bg:var(--card);--ch-cross:rgba(232,238,245,.55);--ch-tip-bg:#0b1118;--ch-chip:#0b1118;--ch-chip-on:#25445f;--ch-skel:#223040;--ch-skel-hi:#2c3d50}
:root[data-theme=light]{--bg:#f3f5f8;--card:#ffffff;--card2:#eef1f5;--fg:#141a22;--mut:#4a5561;--mut2:#596571;--good:#0f7a41;--bad:#c42a22;--warn:#8f6209;--acc:#1a63cc;--line:#dde3ea;--line2:#cfd7e0;--glass:rgba(243,245,248,.88);color-scheme:light;
  --ch-grid:rgba(20,26,34,.12);--ch-axis:rgba(20,26,34,.42);--ch-bg:#fff;--ch-cross:rgba(20,26,34,.55);--ch-tip-bg:#fff;--ch-chip:#eef1f5;--ch-chip-on:#d6e4f5;--ch-skel:#e6eaef;--ch-skel-hi:#f6f8fa;--ch-text:#4a5561;--ch-strong:#141a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--fg);font:.9375rem/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif}
body{padding:var(--sat) 0 calc(var(--nav) + var(--sab) + 8px) 0;min-height:100vh}
/* opaque strip under the translucent iOS status bar: scrolled content never shows through the clock/battery */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:60;pointer-events:none}
[hidden]{display:none!important}
b,strong{font-weight:650}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num,.big,.px,.row>span:last-child,td.n,.kv b,.hero .chg,.tick .p,.tick .c,.tile .v{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- status strip: ONE line (summary) + the detailed banners behind a tap; ids/classes/texts are read by the checks ---- */
.banner{padding:5px var(--pad);font-weight:600;font-size:.75rem;line-height:1.35;text-align:left;border-bottom:1px solid rgba(0,0,0,.25);overflow-wrap:anywhere}
#strip{background:var(--card);border-bottom:1px solid var(--line)}
#stripsum{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 var(--pad);border:0;background:none;color:var(--mut);font:inherit;font-size:.75rem;font-weight:600;text-align:left;cursor:pointer}
#stripsum .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px rgba(47,211,122,.18)}
#stripsum.warn .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(245,184,74,.2)}#stripsum.bad .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(255,90,90,.2)}
#stripsum .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stripsum .t b{color:var(--fg)}
#stripsum.bad .t b,#stripsum.bad .t{color:var(--bad)}#stripsum.warn .t b{color:var(--warn)}
#stripsum .chev{width:16px;height:16px;flex:none;transition:transform .15s;color:var(--mut2)}
#strip.open #stripsum .chev{transform:rotate(180deg)}
#stripdet{display:none}
#strip.open #stripdet{display:block}
#paper,#botfresh,#away{padding:6px var(--pad);font-weight:500;font-size:.75rem;white-space:normal}
#gear{min-height:40px}
.dummy{background:#b8860b;color:#111}.stale{background:var(--bad);color:#111}.snap{background:#1d3650;color:var(--fg)}
#fresh.fwarn{background:var(--warn);color:#111}#fresh.fbad{background:var(--bad);color:#111}#fresh.finfo{background:#1d3650;color:var(--fg)}
#paper{background:#17402f;color:#d6f5e3}#botfresh.snap{background:#121a24;color:var(--mut)}
#botfresh.bf-stale,#botfresh.bf-no-run-yet{background:var(--warn);color:#111}#botfresh.bf-not-reporting{background:var(--bad);color:#111}
#away.snap{background:#121a24;color:var(--mut);font-weight:500}
.oldish{background:#7a5a12;color:#fff}
#msg{font-weight:600}
:root[data-theme=light] #botfresh.snap,:root[data-theme=light] #away.snap,:root[data-theme=light] .snap{background:#e3e8ee;color:#3f4a56}
:root[data-theme=light] #paper{background:#d9f0e3;color:#17402f}
:root[data-theme=light] .tick .ic,:root[data-theme=light] .menu .ic{background:#e9edf2}
/* ---- sticky header (under the status bar strip) ---- */
header{display:flex;align-items:center;gap:10px;padding:8px var(--pad) 6px;position:sticky;top:var(--sat);z-index:40;min-height:var(--hdr);background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
h1{font-size:1.375rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.75rem;font-weight:700;letter-spacing:.04em;border:1px solid var(--good);color:var(--good);border-radius:99px;padding:3px 9px;white-space:nowrap;line-height:1.2}
.pill.sim{border-color:var(--warn);color:var(--warn)}
.pill.priv{border-color:var(--warn);color:var(--warn)}
.ibtn{width:44px;height:44px;margin:-4px -8px -4px 0;padding:0;border:0;border-radius:12px;background:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn svg{width:22px;height:22px}
.ibtn:active{background:var(--card2)}
/* ---- content ---- */
main{padding:0 var(--pad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;position:relative}
.card.tap{cursor:pointer;transition:transform .12s ease,background .12s ease}
.card.tap:active{transform:scale(.985);background:var(--card2)}
.card.bad{border-color:var(--bad);color:var(--bad)}
.lbl{color:var(--mut);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.big{font-size:2.25rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.hero{padding:18px 16px 12px}
.hero .chg{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.9375rem;font-weight:600;flex-wrap:wrap}
.hero .chg .pc{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(127,127,127,.15)}
.hero .chg.good .pc{background:rgba(47,211,122,.16)}.hero .chg.bad .pc{background:rgba(255,90,90,.16)}
.hero .sub{color:var(--mut);font-size:.75rem;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-height:40px}
.row:first-child,.lbl+.row{border-top:0}
.row>span:first-child{color:var(--mut);font-size:.875rem}
.row>span:last-child{text-align:right;font-weight:500;overflow-wrap:anywhere}
.row>span:first-child{min-width:0;flex:1 1 auto}
.row .vp{flex:none;white-space:nowrap;overflow-wrap:normal;word-break:keep-all;hyphens:none}
.mut{color:var(--mut);font-size:.8125rem}.mut2{color:var(--mut2)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--acc)}
.small{font-size:.75rem}
pre.dg{white-space:pre-wrap;margin:8px 0 0;font:.8125rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg)}
h2.sec{font-size:1.0625rem;margin:18px 0 8px;letter-spacing:-.01em}
h2.sec .cap{font-weight:400;color:var(--mut);font-size:.8125rem;margin-left:6px}
/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .lbl{margin-bottom:2px;font-size:.75rem}
.tile .v{font-size:1.0625rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .s{color:var(--mut);font-size:.75rem;margin-top:2px}
.tiles.two{grid-template-columns:1fr 1fr}
/* status hero (Health) */
.state{display:flex;align-items:center;gap:14px}
.state .ring{width:52px;height:52px;border-radius:50%;border:3px solid var(--good);display:flex;align-items:center;justify-content:center;flex:none;color:var(--good)}
.state .ring svg{width:26px;height:26px}
.state.warn .ring{border-color:var(--warn);color:var(--warn)}.state.bad .ring{border-color:var(--bad);color:var(--bad)}
.state .t{flex:1;min-width:0}.state .t b{display:block;font-size:1.25rem;letter-spacing:-.01em}.state .t .s{color:var(--mut);font-size:.8125rem}
.state .t .k{display:block;color:var(--mut);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.state .t b:first-letter{text-transform:uppercase}
.flag b{font-weight:700;margin-left:5px;color:var(--fg)}.flag.on b{color:var(--bad)}.flag.ok b{color:var(--good)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.flag{font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--mut)}
.flag.on{border-color:var(--bad);color:var(--bad)}.flag.ok{color:var(--good)}
/* chips / segmented */
/* 11-20 judge fix: the chip row scrolls edge to edge (bleeds through the page padding) so the last visible chip ("Our positions")
   is no longer cut 16 px inside the screen; a right-edge fade says there is more */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--pad)) 10px;padding:2px var(--pad);scroll-padding:0 var(--pad);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
/* Paper | Live switch at the top of Home (app.js sideSwitch): 44 px halves, the chosen side filled, a one-word sub-label */
.seg.side{margin:0 0 12px}
.seg.side button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15;min-height:48px;font-size:.9375rem;font-weight:700}
.seg.side button small{font-size:.75rem;font-weight:500;color:var(--mut);letter-spacing:.02em;text-transform:none}
.seg.side button.on{background:var(--fg);color:var(--bg)}
.seg.side button.on small{color:var(--bg)}
.seg.side button[data-side=live].on{box-shadow:inset 0 0 0 2px var(--acc)}
.chip{flex:none;min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:.8125rem;font-weight:600;cursor:pointer;transition:background .12s}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:active{transform:scale(.96)}
.chip .n{font-weight:500;opacity:.8;margin-left:4px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--mut);font:inherit;font-size:.875rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.ranges{display:flex;gap:4px;margin:8px 0 0}
.ranges button{flex:1;min-height:44px;border:0;border-radius:8px;background:none;color:var(--mut);font:inherit;font-size:.75rem;font-weight:700;cursor:pointer}
.ranges button.on{background:var(--card2);color:var(--fg)}
.ranges button:disabled{color:var(--mut2);cursor:default}
/* sticky search + filter head (Markets) */
.mkhead{position:sticky;top:calc(var(--sat) + var(--hdr));z-index:30;background:var(--bg);margin:0 calc(-1 * var(--pad));padding:4px var(--pad) 0}
/* charts */
.chart{position:relative;margin:4px -4px 0;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
svg.spark{width:100%;height:70px;display:block}
svg.mini{width:72px;height:28px;display:block}
.c-line{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-line.good{stroke:var(--good)}.c-line.bad{stroke:var(--bad)}
.c-area{fill:url(#ga);opacity:.9}
.c-bench{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-dasharray:4 4}
.c-grid{stroke:var(--line);stroke-width:1}
.c-ax{fill:var(--mut);font-size:12px;font-family:inherit;font-variant-numeric:tabular-nums}
.mut a.acc,.small a.acc{display:inline-block;padding:14px 4px;margin:-14px -4px;font-weight:600}
.c-entry{stroke:var(--acc);stroke-width:1.2;stroke-dasharray:5 4}.c-stop{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:3 3}
.c-mark{fill:var(--good);stroke:var(--bg);stroke-width:1}.c-mark.sell{fill:var(--bad)}
.c-up{fill:var(--good);stroke:var(--good)}.c-dn{fill:var(--bad);stroke:var(--bad)}
.c-x{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3}
.c-dot{fill:var(--fg);stroke:var(--bg);stroke-width:2}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:.75rem;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;z-index:3}
.tip b{display:block;font-size:.8125rem}
.empty{padding:22px 10px;text-align:center;color:var(--mut);font-size:.8125rem}
.empty b{display:block;color:var(--fg);font-size:.875rem;margin-bottom:4px}
.empty.compact{padding:10px 6px 6px}
/* donut */
.donut{display:flex;align-items:center;gap:14px}
.donut svg{width:96px;height:96px;flex:none}
.donut .leg{flex:1;min-width:0}
.donut .leg .row{padding:5px 0;min-height:30px}
.leg i,.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
.k0{background:#f7931a;fill:#f7931a;color:#f7931a}.k1{background:#627eea;fill:#627eea;color:#627eea}.k2{background:#8c9bab;fill:#8c9bab;color:#8c9bab}.k3{background:#2fd37a;fill:#2fd37a;color:#2fd37a}.k4{background:#f5b84a;fill:#f5b84a;color:#f5b84a}.k5{background:#c084fc;fill:#c084fc;color:#c084fc}.k6{background:#34d1bf;fill:#34d1bf;color:#34d1bf}
/* cash / unallocated: its own grey (11-20 judge fix), never shared with a position colour; lighter on light theme */
.kc{background:#5b6b7c;fill:#5b6b7c;color:#5b6b7c}
:root[data-theme=light] .kc{background:#aab6c3;fill:#aab6c3;color:#aab6c3}
/* lists (markets, trades) */
.list{margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tick{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:56px;border-top:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer;transition:background .12s}
.tick:first-child{border-top:0}
.tick:active{background:var(--card2)}
.tick .ic{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--fg);flex:none;letter-spacing:.02em}
.tick .nm{flex:1;min-width:0}
.tick .nm b{display:block;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 11-20 judge fix: row subtitles (strategy, quantity @ entry) wrap to two lines instead of being cut with an ellipsis */
.tick .nm .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--mut);font-size:.75rem;white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.3}
.tick.mk{padding:9px 10px 9px 14px}.tick.mk .nm{flex:1 1 120px}
.tick .pr .p,.tick .pr .c,.fill .m .s,.fill .r .s,.tile .v,.tile .s{display:block}
.tick .sp{flex:none}
.tick .pr{text-align:right;flex:none;min-width:74px}
.tick .pr .p{font-weight:650;font-size:.9375rem}
.tick .pr .c{font-size:.75rem;font-weight:600;margin-top:1px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;padding:0 6px;line-height:18px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);margin-left:6px;vertical-align:middle;text-transform:uppercase}
.badge.held{border-color:var(--acc);color:var(--acc)}.badge.cand{border-color:var(--good);color:var(--good)}.badge.buy{border-color:var(--good);color:var(--good)}.badge.sell{border-color:var(--bad);color:var(--bad)}
.star{width:44px;height:44px;margin:-5px -8px -5px 0;border:0;background:none;color:var(--mut2);font-size:1.25rem;padding:0;flex:none;cursor:pointer}
.star.on{color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:0 0 10px;min-height:46px}
.search input{flex:1;border:0;background:none;color:var(--fg);font:inherit;font-size:1rem;min-height:44px;padding:0;margin:0;outline:none}
.search svg{width:18px;height:18px;color:var(--mut)}
.fill{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.fill:first-child{border-top:0}
.fill .side{width:40px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex:none;letter-spacing:-.01em}
.fill .side.buy{background:rgba(47,211,122,.16);color:var(--good)}.fill .side.sell{background:rgba(255,90,90,.16);color:var(--bad)}
.fill .m{flex:1;min-width:0}.fill .m b{display:block;font-size:.875rem}.fill .m .s{color:var(--mut);font-size:.75rem}
.fill .r{text-align:right;flex:none}.fill .r b{display:block;font-size:.875rem}.fill .r .s{color:var(--mut);font-size:.75rem}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:6px}
.kv div{min-width:0}.kv .lbl{margin-bottom:0;font-size:.75rem}.kv b{display:block;font-size:.9375rem;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--good)}
.bar.w i{background:var(--warn)}
/* alerts */
.alert{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--mut)}
.alert.warning .dot{background:var(--warn)}.alert.critical .dot{background:var(--bad)}.alert.info .dot{background:var(--acc)}
.alert .t{flex:1;min-width:0}.alert .t b{display:block;font-size:.875rem}.alert .t .s{color:var(--mut);font-size:.75rem}
.sev{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px;border:1px solid var(--line2);color:var(--mut)}

/* bottom tab bar */

.heatleg{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:600;margin:-4px 2px 12px}

/* trades/portfolio module (app/trades.css) tokens follow the shell palette */
.lx{--lx-bg:var(--bg);--lx-card:var(--card);--lx-card2:var(--card2);--lx-fg:var(--fg);--lx-mut:var(--mut);--lx-faint:var(--mut2);--lx-line:var(--line);--lx-up:var(--good);--lx-down:var(--bad);--lx-warn:var(--warn);--lx-accent:var(--acc);--lx-chip:var(--card);--lx-chip-on:var(--card2);--lx-focus:var(--acc)}

.update{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--sab) + 10px);z-index:55;background:#1f6fd0;color:#fff;border-radius:12px;padding:10px 14px;font-size:.8125rem;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}

:root{

/* ---- trades.css ---- */
:root{
--lx-bg:var(--bg,#0b1016);--lx-card:var(--card,#141c26);--lx-card2:#1a2430;--lx-fg:var(--fg,#e8eef5);--lx-mut:var(--mut,#94a6b8);

--lx-accent:#5aa9ff;--lx-bench:#9b8cff;--lx-chip:#0e151d;--lx-chip-on:#22384f;--lx-focus:#5aa9ff;--lx-sticky-top:0px;
--lx-c1:#5aa9ff;--lx-c2:#9b8cff;--lx-c3:#f5b84a;--lx-c4:#2ec4c4;--lx-c5:#ff8fc8;--lx-c6:#c7d36f;--lx-cash:#4a5a6b;

--lx-cash:#9aa8b6;
}
.lx{color:var(--lx-fg);font:.9375rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 24px;max-width:640px;margin:0 auto}

.lx :focus-visible{outline:2px solid var(--lx-focus);outline-offset:2px;border-radius:8px}
.lx .up{color:var(--lx-up)}.lx .down{color:var(--lx-down)}.lx .flat,.lx .mut{color:var(--lx-mut)}.lx .warn{color:var(--lx-warn)}

.lx-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--lx-line);min-height:44px}

.lx-filters::-webkit-scrollbar{display:none}
.lx-chipsel{position:relative;flex:0 0 auto}
.lx-chipsel select{appearance:none;-webkit-appearance:none;min-height:44px;padding:0 30px 0 14px;border-radius:22px;border:1px solid var(--lx-line);
background:var(--lx-chip);color:var(--lx-fg);font:600 14px system-ui,sans-serif;margin:0;width:auto}

.lx-chipsel:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--lx-mut);border-bottom:2px solid var(--lx-mut);
transform:translateY(-70%) rotate(45deg);pointer-events:none}
.lx-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.lx-chips button{min-height:44px;min-width:44px;padding:0 12px;border-radius:18px;border:1px solid var(--lx-line);background:var(--lx-chip);color:var(--lx-mut);
font:600 13px system-ui,sans-serif;margin:0;width:auto}
.lx-chips button[aria-pressed="true"]{background:var(--lx-chip-on);color:var(--lx-fg);border-color:var(--lx-accent)}
.lx-chips.touch button{min-height:44px}
.lx-day{position:sticky;top:var(--lx-sticky-top);z-index:1;background:var(--lx-bg);display:flex;justify-content:space-between;align-items:baseline;
padding:12px 2px 6px;font-size:13px;font-weight:650;color:var(--lx-mut)}
.lx-day .num{font-weight:600}
.lx-list{background:var(--lx-card);border:1px solid var(--lx-line);border-radius:14px;overflow:hidden;margin:0 0 4px}
.lx-item{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:60px;border-top:1px solid var(--lx-line)}

.lx-item .lx-main{flex:1;min-width:0}
.lx-item .lx-t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-item .lx-t2{font-size:13px;color:var(--lx-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-item .lx-side{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.lx-item .lx-side .lx-t1{font-weight:650}
.lx-item .lx-chev{width:8px;height:8px;border-right:2px solid var(--lx-faint);border-top:2px solid var(--lx-faint);transform:rotate(45deg);flex:0 0 auto;margin-left:-2px}

background:var(--lx-card2);border:1px solid var(--lx-line)}

.lx-badge.sell{color:var(--lx-down);border-color:color-mix(in srgb,var(--lx-down) 45%,transparent)}

.lx-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.3px;padding:1px 7px;border-radius:6px;background:var(--lx-card2);color:var(--lx-mut);
border:1px solid var(--lx-line);vertical-align:1px}
.lx-more{display:block;width:100%;min-height:48px;margin:10px 0 0;border-radius:12px;border:1px solid var(--lx-line);background:var(--lx-card);color:var(--lx-fg);
font:600 15px system-ui,sans-serif}
.lx-empty{background:var(--lx-card);border:1px dashed var(--lx-line);border-radius:14px;padding:18px 16px;margin:0 0 12px}

.lx-range{padding:6px 0 4px}

.lx-levels{background:var(--lx-card);border:1px solid var(--lx-line);border-radius:14px;padding:12px 14px;margin:0 0 12px}

.lx-chartslot{min-height:120px}

.lx-donut text{fill:var(--lx-fg);font:700 15px system-ui,sans-serif}
.lx-donut text.s{fill:var(--lx-mut);font:600 11px system-ui,sans-serif}
.lx-cal-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.lx-cal-head b{font-size:15px}

.lx-cal button[aria-pressed="true"]{outline:2px solid var(--lx-fg);outline-offset:-2px}
.lx-cal .pad{min-height:44px}
.lx-calsel{min-height:22px;font-size:13px;color:var(--lx-mut);margin:8px 0 0;font-variant-numeric:tabular-nums}
.lx-scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--lx-mut);margin-top:6px}
.lx-csv{min-height:44px;min-width:44px;padding:0 12px;margin:0;border-radius:18px;border:1px solid var(--lx-line);background:var(--lx-chip);color:var(--lx-accent);font:600 13px system-ui,sans-serif;flex:0 0 auto}

.lx-when .lx-row>span:last-child .cap{display:block;font-weight:400;font-size:12px}
.lx-since{border-color:color-mix(in srgb,var(--lx-accent) 45%,var(--lx-line));margin-top:4px}
.lx-since .cap{margin-bottom:2px}

.lx-donut text.s{font-size:12px}
.lx-scale i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--lx-down),var(--lx-card2) 50%,var(--lx-up))}
@media (prefers-reduced-motion:no-preference){.lx-item,.lx-cal button,.lx-seg button{transition:background-color .12s}}
@media (max-width:360px){.lx-tiles{grid-template-columns:repeat(2,1fr)}.lx-hero .lx-big{font-size:30px}}
.lx.lx-riskh{margin-top:12px;padding:0}
.lx-risk .lx-rnote{padding:4px 0 10px}
.lx-risk .lx-row>span:last-child{text-align:right}

/* ---- live.css ---- */
.lv{--lv-bad:#ff7a7a;--lv-top:calc(var(--sat,0px) + var(--hdr,52px))}
:root[data-theme=light] .lv{--lv-bad:var(--bad)}
.lv h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 0 8px}
.lv .lv-mode{border-radius:14px;padding:14px;margin:0 0 12px;border:2px solid var(--line);background:var(--card)}
.lv .lv-mode .w{font-size:1.75rem;font-weight:800;letter-spacing:.04em;line-height:1.1}
.lv .lv-mode .t{margin-top:4px;font-size:.875rem;overflow-wrap:anywhere}

.lv .lv-pill.good{border-color:var(--good);color:var(--good)}.lv .lv-pill.bad{border-color:var(--bad);color:var(--lv-bad)}.lv .lv-pill.warn{border-color:var(--warn);color:var(--warn)}
.lv .lv-pill.nr{border-style:dashed;color:var(--mut)}.lv .lv-pill.acc{border-color:var(--acc);color:var(--acc)}
.lv .lv-nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.lv .lv-nav::-webkit-scrollbar{display:none}
.lv .lv-nav a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;font-size:.875rem;font-weight:600}
.lv .lv-nav a.on{border-color:var(--acc);color:var(--acc)}
.lv .lv-nav a .n{margin-left:6px;color:var(--mut);font-weight:500}

.lv .lv-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 10px}
.lv .lv-hero .big{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}

.pa .pa-spark polyline{fill:none;stroke-width:2;stroke:var(--lx-up);vector-effect:non-scaling-stroke}
.pa .pa-spark polyline.down{stroke:var(--lx-down)}
.pa .lx-row>span:first-child{flex:1 1 50%}

/* ---- ledgerchart.css ---- */
.lc .lc-hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.lc .lc-mode,.lc .lc-badge{font-size:12px;font-weight:700;letter-spacing:.2px;border-radius:6px;padding:1px 6px;border:1px solid var(--lx-line);color:var(--lx-mut);white-space:nowrap}
.lc .lc-mode{border-color:var(--lx-warn);color:var(--lx-warn)}
.lc .lc-badge.warn{border-color:var(--lx-warn);color:var(--lx-fg)}
.lc .lc-plot{min-height:220px}
.lc .lc-kind{margin:6px 0 2px}
.lc .lc-kind button{min-height:44px;min-width:44px}
.lc .lc-kind button:focus-visible{outline:2px solid var(--lx-focus);outline-offset:2px}
.lc .lc-sum,.lc .lc-src{font-size:12px;color:var(--lx-mut);margin:6px 2px;line-height:1.4}
.lc .lc-src.warn{color:var(--lx-fg);border-left:3px solid var(--lx-warn);padding-left:8px}
.lc .lc-list{margin:4px 0 6px;padding:0 0 0 18px;font-size:13px;font-variant-numeric:tabular-nums}
.lc .lc-list li{padding:3px 0}
.lc .lc-list li.lc-big{font-weight:650}
.lx-src.lc-fb{margin:6px 2px 10px;color:var(--lx-fg)}

/* ---- wealth.css ---- */
.wl-wrap{padding:12px 0 8px}
.wl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.wl-mut{color:var(--mut)}.wl-small{font-size:.8125rem}
.wl-wrap small{font-size:.8125rem;color:var(--mut)}
.wl-h{font-size:1.05rem;margin:20px 0 8px;color:var(--mut);font-weight:600}
.wl-dead{border-color:rgba(255,90,90,.35);color:var(--mut)}
.wl-relay{font-size:.8125rem;color:var(--mut);margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.wl-relay.wl-late{color:var(--warn)}.wl-relay.wl-dead{background:none}
.wl-big{font-size:2.1rem;font-weight:700;letter-spacing:-.5px;margin:2px 0 8px;font-variant-numeric:tabular-nums lining-nums}
.wl-lbl{font-size:.8125rem;color:var(--mut);margin:0 0 6px;display:block}
.wl-kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums lining-nums}
.wl-kv span{color:var(--mut)}.wl-kv b{font-weight:600;text-align:right}
.wl-pos{color:var(--good)}.wl-neg{color:var(--bad)}.wl-warn{color:var(--warn)}
.wl-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;font-variant-numeric:tabular-nums lining-nums}
.wl-r{text-align:right}
.wl-tag{font-size:.75rem;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--mut);vertical-align:middle}
.wl-chip{font-size:.75rem;border-radius:99px;padding:2px 8px;border:1px solid var(--line2);color:var(--mut)}
.wl-chip.wl-ok{color:var(--good);border-color:var(--good)}.wl-chip.wl-late{color:var(--warn);border-color:var(--warn)}.wl-chip.wl-dead{color:var(--bad);border-color:var(--bad)}
.wl-mode{border-radius:var(--r);padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2)}
.wl-mode b{font-size:1.1rem;letter-spacing:.08em}.wl-mode span{font-size:.8125rem;color:var(--mut)}
.wl-mock{background:rgba(90,163,255,.12);border-color:var(--acc)}.wl-sandbox{background:rgba(245,184,74,.12);border-color:var(--warn)}.wl-live{background:rgba(255,90,90,.12);border-color:var(--bad)}.wl-nr{background:var(--card);border-color:var(--line2)}
.wl-killon{border-color:var(--bad);background:rgba(255,90,90,.12)}.wl-state{font-weight:800;letter-spacing:.06em;font-size:1.1rem}.wl-killoff{padding:6px 14px}
.wl-link{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;color:var(--acc);font-weight:600}

#stale{display:none!important}
.oldish{background:#7a5a12;color:var(--fg)}
#paper{background:#1f4d3a;color:var(--fg)}
#botfresh.bf-stale,#botfresh.bf-no-run-yet{background:var(--warn);color:#111}
#botfresh.bf-not-reporting{background:var(--bad);color:#111}
#msg{white-space:pre-wrap}
#gear.spin{opacity:.5}
#gear.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#menu{position:absolute;top:46px;right:0;width:240px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:8px;z-index:45;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.mwrap{position:relative}
#menu #minfo{padding:6px 10px 8px;font-size:.75rem}
#menu button,#menu label{display:block;width:100%;text-align:left;margin:0;padding:12px;border-radius:10px;background:none;color:var(--fg);border:0;font-weight:500;font-size:.9375rem;min-height:44px;cursor:pointer}
#menu button:active,#menu label:active{background:var(--card2)}
#menu input{display:none}
#gate{position:fixed;inset:0;background:var(--bg);z-index:40;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;overflow:auto}
/* 11-19 judge fix 3: the shared app.css lays #gate out as a centred flex ROW (made for the LAN app's single card), which put the
   title, the error card and the key card side by side at phone width. Stack them in one column instead. */
#gate{display:block}
#gate>*{max-width:420px;margin-left:auto;margin-right:auto}
#gate h1{margin-top:8px;margin-bottom:14px}
#gate .card{margin:0 auto 12px}
#gatemsg{font-weight:600;overflow-wrap:anywhere}
#gatemsg:empty{display:none}
#relayurl{overflow-wrap:anywhere;word-break:break-all}
#gate textarea{width:100%;min-height:64px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1118;color:var(--fg);font:13px monospace}
#gate button{background:var(--good)}
</style>

<body>
<div id="ptr" hidden>Pull to refresh</div>
<div id="dummy" class="banner dummy" hidden>DUMMY DATA - fixtures, not the real bot</div>
<div id="strip">
  <button id="stripsum" type="button" aria-expanded="false" aria-controls="stripdet" hidden><span class="dot" aria-hidden="true"></span><span class="t"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <div id="stripdet">
    <div id="paper" class="banner snap" hidden></div>
    <div id="botfresh" class="banner snap" hidden></div>
    <div id="away" class="banner snap" hidden></div>
  </div>
</div>
<div id="msg" class="banner stale" hidden role="alert"></div>
<div id="stale" class="banner stale" hidden></div>
<div id="gate" hidden>
  <h1>Dash</h1>
  <div id="gatemsg" class="card bad" aria-live="polite"></div>
  <div class="card">
    <div class="mut">Key (from the PC, starts with TAK1). Typed or pasted once; it never leaves this phone.</div>
    <input id="keyin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TAK1-XXXX-XXXX-...">
    <div class="mut">Snapshot address (fixed in this build, cannot be changed): <span id="relayurl"></span></div>
    <button id="gsave" type="button">Save and load</button>
  </div>
</div>
<header><h1 id="title">Overview</h1><span id="ro" class="pill">READ-ONLY</span><span class="mwrap"><button id="gear" type="button" class="ibtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="sr">Menu</span></button><div id="menu" hidden>
  <div id="minfo" class="mut"></div>
  <button id="mref" type="button">Refresh now</button>
  <label>Import file<input id="mimp" type="file"></label>
  <button id="mkey" type="button">Change key</button>
  <button id="mforget" type="button">Forget key and data</button>
</div></span></header>
<main id="view" aria-live="polite"></main>
<nav id="tabs">
  <a href="#home" data-t="home">Home</a>
  <a href="#pos" data-t="pos">Positions</a>
  <a href="#alerts" data-t="alerts">Alerts</a>
  <a href="#health" data-t="health">Health</a>
  <a href="#ctl" data-t="ctl">Controls</a>
</nav>

      ['away_cfg', 'away_last', 'away_market', 'away_pkh'].concat(Object.keys(localStorage).filter(function (k) { return k.indexOf('away_seq_') === 0 || k.indexOf('away_mseq_') === 0 || k.indexOf('away_lseq_') === 0 || k.indexOf('ui_') === 0; })).forEach(function (k) { ls(k, null); });

  };

  // ---------- pull to refresh ----------
  var ty = null, ready = false;
  document.addEventListener('touchstart', function (e) { ty = (window.scrollY <= 0 && $('gate').hidden && e.touches.length === 1) ? e.touches[0].clientY : null; ready = false; }, { passive: true });

  // ---------- live.enc: the executor snapshot (schema live/1) behind its OWN key (11-20 data gate) ----------
  // Rules (LIVE_RELAY_PLAN.md): real balances and orders never travel under the paper key. live.enc is encrypted on the PC with a
  // second key (its own kid counter, container magic 'TAL1'); this phone keeps that key as a second non-extractable CryptoKey

  var LIVE_URL = RELAY_URL.replace(/latest\.enc$/, 'live.enc'), LIVE_MAX_S = 5 * 60;
  var LV = { state: 'nokey', msg: '', o: null, seq: 0, asof: 0, src: null, at: 0, kid: 0 }, lkey = null, lkid = 0, liveBusy = false, pkh = ls('away_pkh') || '';

  function liveSet(state, msg, extra) { LV.state = state; LV.msg = msg || ''; if (extra) for (var k in extra) LV[k] = extra[k]; document.body.dataset.live = state; if (appLoaded && /^#live(\/|$)/.test(location.hash)) window.dispatchEvent(new Event('hashchange')); }
  function installLiveKey(parsed) {
    return crypto.subtle.digest('SHA-256', parsed.raw).then(function (h) {
      if (pkh && hex(h).slice(0, 32) === pkh) throw E('samekey', 'That is the PAPER key. The Live screen needs its own key (python relay_key.py init in the live state folder, LIVE_RELAY_PLAN.md).');

      lkey = k; lkid = parsed.kid; LV.kid = lkid;
      return idbOp('readwrite', function (s) { return s.put({ kid: lkid, key: k }, 'livekey'); }).catch(function () { /* session-only key */ });
    });
  }
  function decodeLive(b) {
    if (!lkey) return Promise.reject(E('nokey', 'no live key'));
    if (!(b instanceof Uint8Array) || b.length < 50 || b.length > MAX_BYTES) return Promise.reject(E('format', 'live file size'));
    if (b[0] !== 84 || b[1] !== 65 || b[2] !== 76 || b[3] !== 49 || b[5] !== 0) return Promise.reject(E('format', 'not a live snapshot (bad header)'));

    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(22, 34), additionalData: b.slice(0, 22), tagLength: 128 }, lkey, b.slice(34))

        var stored = Number(ls('away_lseq_' + lkid) || 0); if (seq < stored) throw E('replay', 'live file older than one this phone already accepted (seq ' + seq + ' < ' + stored + ')');

      });
  }
  function acceptLive(r, src, at) {
    var cur = Number(ls('away_lseq_' + lkid) || 0); if (r.seq >= cur) ls('away_lseq_' + lkid, String(r.seq));
    if (src === 'net') idbOp('readwrite', function (s) { return s.put({ kid: lkid, blob: r.blob, at: Math.floor(Date.now() / 1000) }, 'live'); }).catch(function () { });
    liveSet('ok', '', { o: r.o, seq: r.seq, asof: r.asof, src: src, at: at || Math.floor(Date.now() / 1000) });
  }
  function loadSavedLive() {
    return idbOp('readonly', function (s) { return s.get('live'); }).then(function (v) {
      if (!v || v.kid !== lkid || !(v.blob instanceof Uint8Array)) return false;
      return decodeLive(v.blob).then(function (r) { acceptLive(r, 'saved', v.at); return true; }, function () { return false; });
    }, function () { return false; });
  }
  var LIVE_TXT = { missing: 'Live relay not enabled: there is no live.enc at the relay yet.',
    net: 'Cannot reach the live file right now.', auth: 'The live file failed authentication (wrong live key, or it was altered). Nothing from it is shown.',
    kid: 'The live key was rotated on the PC. Enter the new live key.', replay: 'The live file is OLDER than one this phone already accepted. Refused.',
    json: 'The live file decrypted but is not valid data. Refused.', shape: 'The live file decrypted but is not the expected format. Refused.', format: 'The file at the live address is not a live snapshot.' };
  function liveRefresh(force, maxAge) {
    if (!lkey) { liveSet('nokey', 'Live: not enabled on this phone. It needs its OWN key from the PC (never the paper key).'); return Promise.resolve(); }
    if (liveBusy) return Promise.resolve();

    });
  }

    status: function () { return { state: LV.state, msg: LV.msg, o: LV.o, seq: LV.seq, asof: LV.asof, src: LV.src, at: LV.at, kid: LV.kid, hasKey: !!lkey, url: LIVE_URL }; },
    refresh: function () { return liveRefresh(true); },
    setKey: function (text) { return parseKey(text).then(installLiveKey).then(function () { LV.o = null; LV.at = 0; return liveRefresh(true); }); },

  };

  idbOp('readonly', function (s) { return s.get('livekey'); }).then(function (v) { if (v && v.key) { lkey = v.key; lkid = v.kid; LV.kid = lkid; } }).catch(function () { });

  // ---------- start ----------
  function init() {
    if (!window.crypto || !crypto.subtle) { document.body.innerHTML = '<p style="padding:24px">This browser cannot do the encryption needed (Web Crypto needs https). Open the app from its https address.</p>'; return; }

    ls('away_market', null);                 // older builds kept the market ciphertext in localStorage: now IndexedDB (size limits)

      : idbOp('readonly', function (s) { return s.get('key'); }).then(function (v) { if (v && v.key) { ckey = v.key; kid = v.kid; } }).catch(function () { });
    start.catch(function (e) { setTimeout(function () { openGate(e.message); }, 0); }).then(function () {
      if (!ckey) return openGate('Enter the key from the PC once. It stays on this phone only.');
      return refresh(false);
    });
    setInterval(paint, 30000);
    setInterval(function () { if (!document.hidden && Date.now() - lastTry > 5 * 60000) refresh(false); }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - lastTry > 60000) refresh(false); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { });
  }

  init();
})();
